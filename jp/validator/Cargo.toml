[package]
name = "helios-jp-validator"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
description = "Experimental native Rust JP Core / JP-CLINS validator built on Helios"
repository = "https://github.com/genshiai/helios-jp"
readme = "README.md"
publish = false

# Helios pins serde/serde_json; keep its evaluation isolated from the chart's lockfile.
[workspace]

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
helios-fhir = { version = "=0.2.7", default-features = false, features = ["R4"] }
helios-fhir-validator = { version = "=0.2.7", default-features = false, features = ["R4", "fhirpath"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
hex = "0.4"
roxmltree = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "=1.0.224", features = ["derive"] }
serde_json = "=1.0.144"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
